approvedGitRepositories:
  - '**'

enableScripts: true

# Use the node_modules linker, not Yarn PnP. The dependency stack
# (@sentry/nextjs → @sentry/opentelemetry → @opentelemetry/core, plus the
# wagmi/walletconnect graph) relies on loose peer-dependency hoisting that
# PnP rejects. Without this, a clean install on CI — or any teammate without
# a global `nodeLinker` setting — defaults to PnP and `next build` fails with
# "@sentry/opentelemetry tried to access @opentelemetry/core". This pins the
# linker so every environment matches local/Vercel.
nodeLinker: node-modules

npmMinimalAgeGate: 0
