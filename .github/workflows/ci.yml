name: CI

on:
  pull_request: {}
  push:
    branches: [main, dev]

# Cancel an in-progress run when a newer commit is pushed to the same ref —
# saves Actions minutes and gives faster feedback on the latest code.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # corepack first so the `yarn` shim resolves to the version pinned in
      # package.json (`packageManager: yarn@4.15.0`) before setup-node caches.
      - run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      # `next build` generates next-env.d.ts and .next/types, which `tsc` needs
      # to resolve image imports and route types — so build runs before the
      # standalone typecheck. The build itself also fails on type errors in the
      # build graph; the explicit `tsc --noEmit` is a full-project backstop.
      - name: Build
        run: yarn build

      - name: Typecheck
        run: yarn typecheck
